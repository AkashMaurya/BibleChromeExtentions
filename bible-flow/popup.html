<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bible Flow</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="container">

    <!-- HEADER -->
    <header class="header glass-card">
      <div class="logo">
        <span class="logo-icon">✝</span>
        <h1 class="logo-text">READ Bible by Jesus Sheep Aakash</h1>
      </div>
      <div class="header-controls">
        <button
          id="auto-copy-toggle"
          class="ctrl-btn active"
          aria-label="Toggle auto copy"
          title="Auto Copy: ON"
        >📋</button>
        <button
          id="theme-toggle"
          class="ctrl-btn"
          aria-label="Toggle theme"
          title="Switch theme"
        >🌙</button>
      </div>
    </header>

    <!-- DROPDOWN SELECTORS -->
    <section class="selector-section glass-card">
      <div class="selector-row">
        <label for="testament-select">📖 Testament:</label>
        <select id="testament-select">
          <option value="">Select Testament</option>
          <option value="old">Old Testament (पुराना नियम)</option>
          <option value="new">New Testament (नया नियम)</option>
        </select>
      </div>

      <div class="selector-row">
        <label for="book-select">📖 Book (पुस्तक):</label>
        <select id="book-select" disabled>
          <option value="">Select Book First</option>
        </select>
      </div>

      <div class="selector-row">
        <label for="chapter-select">📖 Chapter (अध्याय):</label>
        <select id="chapter-select" disabled>
          <option value="">Select Book First</option>
        </select>
      </div>
    </section>

    <!-- VERSE LIST -->
    <section class="verses-section glass-card" id="verses-section" hidden>
      <div class="verses-header">
        <h3 id="verses-title">Verses</h3>
        <div class="verses-actions">
          <button id="select-all-btn" class="small-btn">Select All</button>
          <button id="clear-all-btn" class="small-btn">Clear All</button>
        </div>
      </div>
      <div class="verses-list" id="verses-list"></div>
      <button id="copy-selected-btn" class="copy-selected-btn">
        📋 Copy Selected Verses
      </button>
    </section>

    <!-- COPY BADGE -->
    <span class="badge-copied" id="badge-copied">✓ Copied!</span>

    <!-- HISTORY -->
    <section class="history-section glass-card" id="history-section" hidden>
      <h3 class="history-title">Recent Copies</h3>
      <div class="history-list" id="history-list"></div>
      <button class="clear-history-btn" id="clear-history-btn">Clear History</button>
    </section>

    <!-- FOOTER -->
    <footer class="footer">
      <p>Bible Flow v2.1 &bull; हिंदी बाइबल &bull; </p>
    </footer>

  </main>

  <script src="popup.js"></script>
</body>
</html>
