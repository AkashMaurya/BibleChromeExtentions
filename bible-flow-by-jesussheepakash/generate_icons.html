<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Bible Flow – Icon Generator</title>
  <style>
    body { font-family: system-ui; padding: 40px; background: #111; color: #eee; }
    a { display: inline-block; margin: 10px 8px; color: #f59e0b; font-size: 16px; }
    canvas { display: none; }
  </style>
</head>
<body>
  <h1>✝ Bible Flow Icon Generator</h1>
  <p>Click each link to download the PNG icon:</p>
  <div id="links"></div>

  <script>
    [16, 48, 128].forEach(size => {
      const c   = document.createElement('canvas');
      c.width   = size;
      c.height  = size;
      const ctx = c.getContext('2d');

      // Rounded-rect background
      const r = size * 0.22;
      ctx.beginPath();
      ctx.moveTo(r, 0);
      ctx.lineTo(size - r, 0);
      ctx.quadraticCurveTo(size, 0, size, r);
      ctx.lineTo(size, size - r);
      ctx.quadraticCurveTo(size, size, size - r, size);
      ctx.lineTo(r, size);
      ctx.quadraticCurveTo(0, size, 0, size - r);
      ctx.lineTo(0, r);
      ctx.quadraticCurveTo(0, 0, r, 0);
      ctx.closePath();
      ctx.fillStyle = '#1a1a2e';
      ctx.fill();

      // Gold cross
      const g = ctx.createLinearGradient(0, 0, size, size);
      g.addColorStop(0, '#f59e0b');
      g.addColorStop(1, '#d97706');
      ctx.fillStyle    = g;
      ctx.font         = `bold ${size * 0.55}px serif`;
      ctx.textAlign    = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('✝', size / 2, size / 2 + size * 0.04);

      // Download link
      const a        = document.createElement('a');
      a.href         = c.toDataURL('image/png');
      a.download     = `icon${size}.png`;
      a.textContent  = `⬇ icon${size}.png`;
      document.getElementById('links').appendChild(a);
    });
  </script>
</body>
</html>
